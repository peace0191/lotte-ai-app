# ══════════════════════════════════════════════════════════
#  nginx 설정 — /p/<id> 고정 URL 리라이트
#  파일 위치: /etc/nginx/sites-available/lotte_ai
#
#  적용 방법:
#    sudo nginx -t                    # 문법 검사
#    sudo systemctl reload nginx      # 반영
# ══════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;    # ← 실제 도메인으로 변경

    # ── HTTP → HTTPS 리다이렉트 (인증서 있을 경우) ─────
    # return 301 https://$host$request_uri;

    # ─────────────────────────────────────────────────
    # ✅ 핵심: /p/<id> → /?pid=<id> 리라이트
    # 고객이 /p/PROP_001 로 접속하면 앱이 pid=PROP_001 을 인식
    # ─────────────────────────────────────────────────
    location ~ ^/p/([A-Za-z0-9_-]+)$ {
        return 302 /?pid=$1;
        # 참고: 302 임시 리다이렉트 사용 (SEO보다 운영 유연성 우선)
        # URL이 /?pid=... 로 바뀌는 것이 싫다면 아래 proxy_pass 방식 사용:
        #
        # proxy_pass http://127.0.0.1:8501/?pid=$1;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
        # proxy_read_timeout 86400;
    }

    # ─────────────────────────────────────────────────
    # Streamlit 앱 프록시 (WebSocket 지원 포함)
    # ─────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket 업그레이드 (Streamlit 필수)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # 헤더 전달
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 타임아웃 (long-polling 대응)
        proxy_read_timeout 86400;

        # 업로드 크기 제한 (사진/영상 업로드 고려)
        client_max_body_size 500M;
    }

    # ─────────────────────────────────────────────────
    # 정적 파일 캐시 (선택, 성능 최적화)
    # ─────────────────────────────────────────────────
    location ~* \.(ico|css|js|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        proxy_pass http://127.0.0.1:8501;
        expires    7d;
        add_header Cache-Control "public, immutable";
    }
}

