# ══════════════════════════════════════════════════════════
#  .streamlit/secrets.toml — 9-7 기능 추가분 설정 템플릿
#  (기존 설정에 아래 섹션들을 추가하세요)
# ══════════════════════════════════════════════════════════

# ── 앱 기본 설정 (/p/<id> 고정 URL) ───────────────────────
[app]
base_url            = "https://your-domain.com"   # ← 실제 도메인 입력
detail_path_prefix  = "/p"                         # 상세 경로 프리픽스 (변경 불필요)

# ── 카카오 BizMessage (알림톡) ─────────────────────────────
[kakao_bizmsg]
base_url        = "bizmsg-web.kakaoenterprise.com"
client_id       = "여기에_카카오엔터프라이즈_client_id"
client_secret   = "여기에_client_secret"
sender_key      = "여기에_발신프로필_키"
sender_no       = "021112222"          # 대표 발신 번호 (010 또는 02 형식)

# 카카오 채널에서 심사 통과한 템플릿 코드 입력
template_review  = "TPL_REVIEW_001"    # 검수 요청 → 관리자 알림
template_approve = "TPL_APPROVE_001"   # 승인 완료 → 공급자 알림
template_reserve = "TPL_RESERVE_001"   # 예약 확정 → 고객 알림

# SMS 대체 발송 여부 (false 권장 — 정보성 알림톡만 발송)
fallback_yn = false

# ── KPI 리포트 경로 (기본값 사용 시 입력 불필요) ───────────
# [kpi]
# db_path     = "assets/system/app.db"
# report_dir  = "assets/system/reports"
사합니다! 😊

정리하자면, 이번 문제의 핵심은 setuptools v70+ 에서 pkg_resources가 분리된 것이었고, setuptools==68.2.2로 버전을 고정한 것이 정확한 해결책이었습니다.

앞으로 비슷한 상황을 만나면 아래를 기억해두시면 좋습니다:

ModuleNotFoundError: pkg_resources → setuptools 버전 문제를 먼저 의심
단순히 패키지 이름만 추가하는 것이 아니라 버전까지 명시적으로 고정하는 습관이 중요
