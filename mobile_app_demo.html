                        AI 매수/임대 예약하기
                    </button>
                    <div className="text-[10px] text-gray-400 text-center mt-3">
                        AI 자동 홍보 시스템에 의해 생성된 영상입니다.
                    </div>
                </div>
            </div>
        );

        // --- Layout ---
        function App() {
            const [activeTab, setActiveTab] = useState('region');

            return (
                <div className="max-w-md mx-auto bg-slate-50 min-h-screen relative shadow-2xl overflow-hidden font-sans">

                    {/* Main Content */}
                    <main className="h-full overflow-y-auto hide-scrollbar">
                        {activeTab === 'region' && <RegionTab />}
                        {activeTab === 'listing' && <ListingTab />}
                        {activeTab === 'matching' && <MatchingTab />}
                        {activeTab === 'register' && <RegisterTab />}
                        {activeTab === 'shorts' && <ShortsTab />}
                    </main>

                    {/* Bottom Nav */}
                    <nav className="fixed bottom-0 max-w-md w-full glass-nav flex justify-around items-center h-20 safe-bottom px-1 z-50">
                        <NavBtn icon="ph-map-trifold" label="대치1동" active={activeTab === 'region'} onClick={() => setActiveTab('region')} />
                        <NavBtn icon="ph-star" label="추천매물" active={activeTab === 'listing'} onClick={() => setActiveTab('listing')} />
                        <NavBtn icon="ph-robot" label="AI매칭" active={activeTab === 'matching'} onClick={() => setActiveTab('matching')} />
                        <NavBtn icon="ph-note-pencil" label="매물등록" active={activeTab === 'register'} onClick={() => setActiveTab('register')} />
                        <NavBtn icon="ph-film-strip" label="AI숏츠" active={activeTab === 'shorts'} onClick={() => setActiveTab('shorts')} />
                    </nav>
                </div>
            );
        }

        const NavBtn = ({ icon, label, active, onClick }) => (
            <button onClick={onClick} className={`flex flex-col items-center justify-center w-14 h-full space-y-1 transition-all duration-300 ${active ? 'text-blue-600' : 'text-slate-400 hover:text-slate-600'}`}>
                <div className={`text-2xl mb-0.5 transition-transform duration-300 ${active ? 'scale-110 -translate-y-1' : ''}`}>
                    <i className={`${active ? 'ph-fill' : 'ph'} ${icon}`}></i>
                </div>
                <span className={`text-[10px] ${active ? 'font-bold' : 'font-medium'}`}>{label}</span>
                {active && <div className="w-1 h-1 bg-blue-600 rounded-full mt-0.5 animate-fade-in"></div>}
            </button>
        );

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>

</html>
